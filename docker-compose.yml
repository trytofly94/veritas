# auto-archive — Phase 2 container compose definition.
#
# Required env vars (set via .env or docker compose --env-file):
#   API_KEY          — X-API-Key value for upload + download endpoints
#   SESSION_SECRET   — HMAC secret for session cookies (≥32 bytes)
#   ADMIN_PASSWORD   — password for the browser /login page
#
# Volumes:
#   ./data           — host bind-mount for bundle directories AND manifest.sqlite

services:
  auto-archive:
    # container_name pinned so `docker compose exec` and `docker exec` are
    # deterministic regardless of how Compose names the project (CONCERN-4).
    container_name: auto-archive
    build:
      context: .
      dockerfile: Dockerfile
    image: auto-archive:phase1
    # No host port mapping — container is only reachable via proxy-net
    # (caddy-central → Cloudflare Tunnel). Internal port 3000 stays on
    # the Docker bridge.
    networks:
      - proxy-net
    volumes:
      # Bind mount — bundle directories AND manifest.sqlite land on the host.
      - ./data:/data
    # WR-03: defense-in-depth for a service that handles potentially
    # sensitive evidence. Only /data (bind) and /tmp (tmpfs) need to be
    # writable; the rootfs is read-only. All Linux capabilities are
    # dropped; no-new-privileges blocks setuid escalation paths.
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      DATA_DIR: /data
      PORT: "3000"
      MANIFEST_DB_PATH: /data/manifest.sqlite
      # Required auth env vars — supply via .env file or shell environment.
      # Defaults here are for smoke testing only; override in production.
      API_KEY: ${API_KEY:-smoke-test-api-key-change-in-production}
      SESSION_SECRET: ${SESSION_SECRET:-smoke-test-session-secret-32-bytes-yo}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-smoke-test-password}
      # Optional TSA endpoint overrides — uncomment to point at custom URLs.
      # TSA_DFN_ENDPOINT: http://zeitstempel.dfn.de
      # TSA_FREETSA_ENDPOINT: https://freetsa.org/tsr
      # TSA_DIGICERT_ENDPOINT: http://timestamp.digicert.com
      # TSA_TIMEOUT_MS: "10000"
    restart: unless-stopped

networks:
  proxy-net:
    external: true
